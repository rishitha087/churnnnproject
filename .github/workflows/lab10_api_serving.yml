name: Lab 10 - Churn FastAPI Model Serving & API Validation

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "deployment/**"
      - "tests/test_api.py"
      - ".github/workflows/lab10_api_serving.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-serving-validation:
    name: Verify FastAPI Serving & Endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: Run FastAPI Serving Tests
        run: |
          pytest tests/test_api.py -v

      - name: Test Background API Server Startup & Health
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -f http://127.0.0.1:8000/health || exit 1
          echo "FastAPI server started and responded healthy!"
