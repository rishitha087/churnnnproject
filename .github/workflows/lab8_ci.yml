name: Lab 8 - Churn MLOps Continuous Integration Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  churn-mlops-ci:
    name: Run Churn MLOps Pipeline & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Churn Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Churn MLOps Pipeline
        run: |
          python src/mlops_pipeline/churn_prediction_pipeline.py

      - name: Archive Pipeline Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churn-ci-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            reports/
            outputs/
            logs/
          if-no-files-found: ignore
